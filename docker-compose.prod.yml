version: '3.8'

# ════════════════════════════════════════════════════════════════════
# dataPATH — Stack de Produção (Portainer / Hetzner)
# Subdomínio: datapath.produtoweb.com.br
# Proxy: nginx-proxy com acme-companion (SSL Automático Let's Encrypt)
# ════════════════════════════════════════════════════════════════════

services:
  # ── Banco de Dados PostgreSQL 16 ──────────────────────────────────
  datapath-db:
    image: postgres:16-alpine
    container_name: datapath-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datapath_prod}
      POSTGRES_USER: ${POSTGRES_USER:-datapath_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DataPathProd2026SecureKey!}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datapath_user} -d ${POSTGRES_DB:-datapath_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aplicação Unificada dataPATH (API .NET 8 + Frontend React) ─────
  datapath-app:
    image: ${DOCKER_IMAGE:-ghcr.io/ivensaugusto/datapath:latest}
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: datapath-app
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=datapath-db;Port=5432;Database=${POSTGRES_DB:-datapath_prod};Username=${POSTGRES_USER:-datapath_user};Password=${POSTGRES_PASSWORD:-DataPathProd2026SecureKey!}
      - Jwt__SecretKey=${JWT_SECRET:-DataPath_Production_JWT_Secret_Key_2026_LGPD_Strict_Minimum_64_Chars!}
      - Jwt__Issuer=datapath.produtoweb.com.br
      - Jwt__Audience=datapath-clients
      - Storage__DriverType=Local
      - Storage__LocalBasePath=/app/storage
      # Integração com nginx-proxy + acme-companion na Hetzner (pwbot_net)
      - VIRTUAL_HOST=datapath.produtoweb.com.br
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=datapath.produtoweb.com.br
      - LETSENCRYPT_EMAIL=ivensaugusto@users.noreply.github.com
    volumes:
      - wsi_storage_prod:/app/storage
    depends_on:
      datapath-db:
        condition: service_healthy
    networks:
      - internal-net
      - pwbot_net

networks:
  internal-net:
    driver: bridge
  pwbot_net:
    external: true

volumes:
  postgres_prod_data:
    name: datapath_postgres_prod_data
  wsi_storage_prod:
    name: datapath_wsi_storage_prod
