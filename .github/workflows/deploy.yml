name: 🚀 CI/CD Pipeline - Build & Deploy dataPATH to Hetzner Portainer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore backend/src/DataPath.Api/DataPath.Api.csproj

      - name: Run xUnit Unit Tests
        run: dotnet test backend/tests/DataPath.Tests/DataPath.Tests.csproj --configuration Release --no-restore

  build-and-push-docker:
    name: 🐳 Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-portainer-redeploy:
    name: 🔄 Trigger Portainer Redeploy on Hetzner
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Call Portainer Webhook
        if: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}
        run: |
          echo "Triggering Portainer Webhook for auto-redeploy on datapath.produtoweb.com.br..."
          curl -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}" || echo "Webhook trigger sent."
