name: CI/CD Build and Deploy to Portainer (Hetzner)

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:latest
            ghcr.io/${{ env.REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer Redeploy via API
        shell: pwsh
        run: |
          $portainerUrl = "${{ secrets.PORTAINER_URL }}"
          $user = "${{ secrets.PORTAINER_USER }}"
          $pass = "${{ secrets.PORTAINER_PASSWORD }}"
          $stackId = "${{ secrets.PORTAINER_STACK_ID }}"

          Write-Host "[1/3] Autenticando no Portainer..."
          $authBody = @{ username = $user; password = $pass } | ConvertTo-Json
          $authRes = Invoke-RestMethod -Uri "$portainerUrl/api/auth" -Method Post -Body $authBody -ContentType "application/json"
          $token = [string]$authRes.jwt

          $headers = @{ Authorization = "Bearer $token" }

          Write-Host "[2/3] Obtendo detalhes da Stack $stackId..."
          $stackInfo = Invoke-RestMethod -Uri "$portainerUrl/api/stacks/$stackId" -Method Get -Headers $headers

          Write-Host "[3/3] Executando Redeploy no Portainer com pullImage=true..."
          $endpointId = $stackInfo.EndpointId
          $updateUrl = "$portainerUrl/api/stacks/$stackId?endpointId=$endpointId"

          $fileInfo = Invoke-RestMethod -Uri "$portainerUrl/api/stacks/$stackId/file?endpointId=$endpointId" -Method Get -Headers $headers

          $updatePayload = @{
              stackFileContent = $fileInfo.StackFileContent
              env = $stackInfo.Env
              prune = $true
              pullImage = $true
          } | ConvertTo-Json -Depth 10

          $res = Invoke-RestMethod -Uri $updateUrl -Method Put -Headers $headers -Body $updatePayload -ContentType "application/json"
          Write-Host "✅ DEPLOYMENT NO PORTAINER EXECUTADO COM SUCESSO!"
